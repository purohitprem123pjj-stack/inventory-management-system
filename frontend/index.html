<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Inventory Management</h1>
    <p class="subtitle">Add, search, update and remove products</p>
  </header>

  <main class="layout">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section id="low-stock-banner" class="alert hidden" aria-live="polite"></section>

    <section class="card">
      <h2>Add Product</h2>
      <form id="add-form" novalidate>
        <div class="grid">
          <label>Product ID
            <input name="product_id" required placeholder="e.g. P101" />
          </label>
          <label>Name
            <input name="name" required placeholder="e.g. USB Cable" />
          </label>
          <label>Category
            <input name="category" required placeholder="e.g. Electronics" />
          </label>
          <label>Quantity
            <input name="quantity" type="number" min="0" step="1" required placeholder="0" />
          </label>
          <label>Price (₹)
            <input name="price" type="number" min="0" step="0.01" required placeholder="0.00" />
          </label>
        </div>
        <p id="form-error" class="form-error"></p>
        <button type="submit" class="btn primary">Add Product</button>
      </form>
    </section>

    <section class="card">
      <div class="table-head">
        <h2>Products <span id="count" class="pill">0</span></h2>
        <input id="search" type="search" placeholder="Search by ID, name or category…" />
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product ID</th><th>Name</th><th>Category</th>
              <th class="num">Quantity</th><th class="num">Price (₹)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="product-body"></tbody>
        </table>
      </div>
      <p id="empty" class="empty hidden"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
